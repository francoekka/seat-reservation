databases:
  - name: seat-reservation-db
    databaseName: reservationdb
    user: reservation
    plan: free

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: seat-reservation-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seat-reservation-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seat-reservation-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: seat-reservation-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: seat-reservation-db
          property: password
      - key: RESERVATION_JWT_SECRET
        sync: false
      - key: PORT
        value: "8080"
