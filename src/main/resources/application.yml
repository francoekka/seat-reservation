management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      group:
        liveness:
          include: ping
        readiness:
          include: db, ping
  health:
    db:
      enabled: true

spring:
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  security:
    user:
      name: demo
      password: demo


